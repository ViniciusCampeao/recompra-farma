<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recompra Farma</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💊</text></svg>">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f1117;color:#e4e6ef}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
select option{background:#222632;color:#e4e6ef}
input[type="checkbox"]{accent-color:#6366f1;width:16px;height:16px}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#2d3245;border-radius:3px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, createContext, useContext } = React;

const API = window.location.origin + "/api";
const C = {
  bg:"#0f1117",sf:"#1a1d27",sa:"#222632",bd:"#2d3245",
  tx:"#e4e6ef",tm:"#8b8fa7",pr:"#6366f1",ph:"#818cf8",
  ok:"#22c55e",wn:"#f59e0b",dn:"#ef4444"
};

async function api(path,{method="GET",body,token}={}){
  const h={"Content-Type":"application/json"};
  if(token)h.Authorization="Bearer "+token;
  const r=await fetch(API+path,{method,headers:h,body:body?JSON.stringify(body):undefined});
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.message||"Erro "+r.status)}
  const t=await r.text();return t?JSON.parse(t):null;
}

const inp={width:"100%",padding:"10px 14px",background:C.sa,border:"1px solid "+C.bd,borderRadius:8,color:C.tx,fontSize:14,outline:"none",boxSizing:"border-box"};
const btn={padding:"10px 20px",borderRadius:8,border:"none",cursor:"pointer",fontSize:14,fontWeight:600,display:"inline-flex",alignItems:"center",gap:8,transition:"background .15s"};

function Ic({name,size=20}){
  const s={width:size,height:size,verticalAlign:"middle"};
  const p={
    home:<path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1"/>,
    users:<path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>,
    cart:<path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z"/>,
    tpl:<path d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z"/>,
    plus:<path d="M12 4v16m8-8H4"/>,
    x:<path d="M6 18L18 6M6 6l12 12"/>,
    check:<path d="M5 13l4 4L19 7"/>,
    clock:<path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>,
    out:<path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>,
    pill:<path d="M10.5 3.5a4.95 4.95 0 00-7 7l7 7a4.95 4.95 0 007-7l-7-7zM14 10l-4 4"/>,
    search:<path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>,
    wifi:<path d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.07c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.858 15.355-5.858 21.213 0"/>,
    ref:<path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>,
  };
  return <svg style={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={1.8} strokeLinecap="round" strokeLinejoin="round">{p[name]||null}</svg>;
}

function Badge({children,color=C.pr}){return <span style={{display:"inline-block",padding:"3px 10px",borderRadius:50,fontSize:12,fontWeight:600,background:color+"22",color}}>{children}</span>}
function Card({children,style}){return <div style={{background:C.sf,borderRadius:12,border:"1px solid "+C.bd,padding:24,...style}}>{children}</div>}
function Stat({icon,label,value,color=C.pr}){
  return <Card style={{display:"flex",alignItems:"center",gap:16,flex:"1 1 200px"}}>
    <div style={{width:44,height:44,borderRadius:10,background:color+"18",color,display:"flex",alignItems:"center",justifyContent:"center"}}><Ic name={icon} size={22}/></div>
    <div><div style={{fontSize:26,fontWeight:700,lineHeight:1.1}}>{value}</div><div style={{fontSize:13,color:C.tm,marginTop:2}}>{label}</div></div>
  </Card>;
}
function Modal({open,onClose,title,children,width=520}){
  if(!open)return null;
  return <div style={{position:"fixed",inset:0,zIndex:1000,background:"rgba(0,0,0,.6)",backdropFilter:"blur(4px)",display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={onClose}>
    <div style={{background:C.sf,borderRadius:16,border:"1px solid "+C.bd,width:"100%",maxWidth:width,maxHeight:"90vh",overflow:"auto",padding:28}} onClick={e=>e.stopPropagation()}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <h2 style={{margin:0,fontSize:20}}>{title}</h2>
        <button onClick={onClose} style={{background:"none",border:"none",color:C.tm,cursor:"pointer"}}><Ic name="x" size={22}/></button>
      </div>
      {children}
    </div>
  </div>;
}
function Toast({msg,type="ok",onClose}){
  useEffect(()=>{const t=setTimeout(onClose,3500);return()=>clearTimeout(t)},[onClose]);
  return <div style={{position:"fixed",bottom:24,right:24,zIndex:2000,padding:"14px 22px",borderRadius:10,background:type==="error"?C.dn:C.ok,color:"#fff",fontSize:14,fontWeight:500,boxShadow:"0 8px 30px rgba(0,0,0,.4)",animation:"fadeIn .2s ease"}}>{msg}</div>;
}

const Ctx=createContext(null);
function useA(){return useContext(Ctx)}

function Auth({children}){
  const[token,setToken]=useState(null);
  const[user,setUser]=useState(null);
  const[loading,setLoading]=useState(false);
  const logout=()=>{setToken(null);setUser(null)};
  const login=(t)=>{setToken(t)};
  useEffect(()=>{
    if(!token)return;
    api("/auth/me",{token}).then(setUser).catch(()=>logout());
  },[token]);
  return <Ctx.Provider value={{token,user,loading,login,logout}}>{children}</Ctx.Provider>;
}

function Login(){
  const{login}=useA();
  const[email,setEmail]=useState("");
  const[pw,setPw]=useState("");
  const[err,setErr]=useState("");
  const[ld,setLd]=useState(false);
  const go=async()=>{
    setErr("");setLd(true);
    try{const d=await api("/auth/login",{method:"POST",body:{email,password:pw}});login(d.access_token)}
    catch(e){setErr(e.message)}finally{setLd(false)}
  };
  return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:C.bg,padding:16}}>
    <Card style={{width:"100%",maxWidth:400}}>
      <div style={{textAlign:"center",marginBottom:28}}>
        <div style={{fontSize:32,marginBottom:4}}>💊</div>
        <h1 style={{fontSize:24}}>Recompra Farma</h1>
        <p style={{color:C.tm,fontSize:14,marginTop:6}}>Acesse sua conta</p>
      </div>
      <div style={{marginBottom:14}}><label style={{display:"block",fontSize:13,color:C.tm,marginBottom:6}}>Email</label>
        <input style={inp} type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="admin@farmacia.local" onKeyDown={e=>e.key==="Enter"&&go()}/></div>
      <div style={{marginBottom:20}}><label style={{display:"block",fontSize:13,color:C.tm,marginBottom:6}}>Senha</label>
        <input style={inp} type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="••••••" onKeyDown={e=>e.key==="Enter"&&go()}/></div>
      {err&&<div style={{color:C.dn,fontSize:13,marginBottom:14}}>{err}</div>}
      <button onClick={go} disabled={ld} style={{...btn,width:"100%",justifyContent:"center",background:C.pr,color:"#fff",opacity:ld?.6:1}}>{ld?"Entrando...":"Entrar"}</button>
    </Card>
  </div>;
}

function Dashboard(){
  const{token}=useA();
  const[st,setSt]=useState({c:0,a:0,p:0,s:0});
  const[apiOk,setApiOk]=useState(null);
  useEffect(()=>{
    Promise.all([api("/customers",{token}),api("/purchases",{token})]).then(([cs,ps])=>{
      const a=ps.filter(p=>p.status==="ACTIVE").length;
      const rs=ps.flatMap(p=>p.reminders||[]);
      setSt({c:cs.length,a,p:rs.filter(r=>r.status==="PENDING").length,s:rs.filter(r=>r.status==="SENT").length});
    }).catch(()=>{});
    api("/health",{token}).then(()=>setApiOk(true)).catch(()=>setApiOk(false));
  },[token]);
  return <div>
    <h1 style={{fontSize:24,marginBottom:24}}>Painel</h1>
    <div style={{display:"flex",gap:16,flexWrap:"wrap"}}>
      <Stat icon="users" label="Clientes" value={st.c} color={C.pr}/>
      <Stat icon="cart" label="Compras ativas" value={st.a} color={C.ok}/>
      <Stat icon="clock" label="Pendentes" value={st.p} color={C.wn}/>
      <Stat icon="check" label="Enviados" value={st.s} color={C.ok}/>
    </div>
    <Card style={{marginTop:24}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}><Ic name="wifi" size={20}/><span style={{fontWeight:600}}>Status do Sistema</span></div>
        <Badge color={apiOk===null?C.tm:apiOk?C.ok:C.dn}>{apiOk===null?"Verificando...":apiOk?"API Online":"API Offline"}</Badge>
      </div>
    </Card>
  </div>;
}

function Customers(){
  const{token}=useA();
  const[cs,setCs]=useState([]);
  const[q,setQ]=useState("");
  const[mo,setMo]=useState(false);
  const[toast,setToast]=useState(null);
  const load=useCallback(()=>{api("/customers",{token}).then(setCs).catch(()=>{})},[token]);
  useEffect(()=>{load()},[load]);
  const fl=cs.filter(c=>(c.name||"").toLowerCase().includes(q.toLowerCase())||c.phone.includes(q));
  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:12}}>
      <h1 style={{fontSize:24,margin:0}}>Clientes</h1>
      <button onClick={()=>setMo(true)} style={{...btn,background:C.pr,color:"#fff"}}><Ic name="plus" size={18}/>Novo cliente</button>
    </div>
    <div style={{marginBottom:16,position:"relative"}}>
      <input style={{...inp,paddingLeft:40}} placeholder="Buscar por nome ou telefone..." value={q} onChange={e=>setQ(e.target.value)}/>
      <span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",color:C.tm}}><Ic name="search" size={18}/></span>
    </div>
    <Card style={{padding:0,overflow:"auto"}}>
      <table style={{width:"100%",borderCollapse:"collapse",minWidth:500}}>
        <thead><tr style={{borderBottom:"1px solid "+C.bd}}>
          {["Nome","Telefone","Compras","Cadastro"].map(h=><th key={h} style={{padding:"12px 16px",textAlign:"left",fontSize:13,color:C.tm,fontWeight:600}}>{h}</th>)}
        </tr></thead>
        <tbody>
          {fl.length===0?<tr><td colSpan={4} style={{padding:32,textAlign:"center",color:C.tm}}>{cs.length===0?"Nenhum cliente":"Nenhum resultado"}</td></tr>
          :fl.map(c=><tr key={c.id} style={{borderBottom:"1px solid "+C.bd}}>
            <td style={{padding:"12px 16px",fontWeight:500}}>{c.name||"—"}</td>
            <td style={{padding:"12px 16px",color:C.tm,fontFamily:"monospace",fontSize:13}}>{c.phone}</td>
            <td style={{padding:"12px 16px"}}><Badge>{c._count?.purchases??0}</Badge></td>
            <td style={{padding:"12px 16px",color:C.tm,fontSize:13}}>{new Date(c.createdAt).toLocaleDateString("pt-BR")}</td>
          </tr>)}
        </tbody>
      </table>
    </Card>
    <CustModal open={mo} onClose={()=>setMo(false)} onOk={()=>{load();setMo(false);setToast("Cliente criado")}}/>
    {toast&&<Toast msg={toast} onClose={()=>setToast(null)}/>}
  </div>;
}
function CustModal({open,onClose,onOk}){
  const{token}=useA();
  const[name,setName]=useState("");
  const[phone,setPhone]=useState("");
  const[err,setErr]=useState("");
  const[ld,setLd]=useState(false);
  const go=async()=>{
    if(!phone.trim()){setErr("Telefone obrigatório");return}
    setErr("");setLd(true);
    try{await api("/customers",{method:"POST",body:{name:name||undefined,phone},token});setName("");setPhone("");onOk()}
    catch(e){setErr(e.message)}finally{setLd(false)}
  };
  return <Modal open={open} onClose={onClose} title="Novo cliente">
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div><label style={{display:"block",fontSize:13,color:C.tm,marginBottom:6}}>Nome (opcional)</label>
        <input style={inp} value={name} onChange={e=>setName(e.target.value)} placeholder="João Silva"/></div>
      <div><label style={{display:"block",fontSize:13,color:C.tm,marginBottom:6}}>Telefone</label>
        <input style={inp} value={phone} onChange={e=>setPhone(e.target.value)} placeholder="14999887766"/></div>
      {err&&<div style={{color:C.dn,fontSize:13}}>{err}</div>}
      <button onClick={go} disabled={ld} style={{...btn,justifyContent:"center",background:C.pr,color:"#fff",marginTop:4}}>{ld?"Salvando...":"Criar cliente"}</button>
    </div>
  </Modal>;
}

function Purchases(){
  const{token}=useA();
  const[ps,setPs]=useState([]);
  const[mo,setMo]=useState(false);
  const[toast,setToast]=useState(null);
  const load=useCallback(()=>{api("/purchases",{token}).then(setPs).catch(()=>{})},[token]);
  useEffect(()=>{load()},[load]);
  const sc={ACTIVE:C.ok,FINISHED:C.tm,CANCELLED:C.dn};
  const sl={ACTIVE:"Ativo",FINISHED:"Finalizado",CANCELLED:"Cancelado"};
  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:12}}>
      <h1 style={{fontSize:24,margin:0}}>Compras</h1>
      <button onClick={()=>setMo(true)} style={{...btn,background:C.pr,color:"#fff"}}><Ic name="plus" size={18}/>Nova compra</button>
    </div>
    <Card style={{padding:0,overflow:"auto"}}>
      <table style={{width:"100%",borderCollapse:"collapse",minWidth:700}}>
        <thead><tr style={{borderBottom:"1px solid "+C.bd}}>
          {["Cliente","Medicamento","Qtd","Término","Status","Lembretes"].map(h=><th key={h} style={{padding:"12px 16px",textAlign:"left",fontSize:13,color:C.tm,fontWeight:600}}>{h}</th>)}
        </tr></thead>
        <tbody>
          {ps.length===0?<tr><td colSpan={6} style={{padding:32,textAlign:"center",color:C.tm}}>Nenhuma compra</td></tr>
          :ps.map(p=>{const rs=p.reminders||[];return <tr key={p.id} style={{borderBottom:"1px solid "+C.bd}}>
            <td style={{padding:"12px 16px",fontWeight:500}}>{p.customer?.name||p.customer?.phone||"—"}</td>
            <td style={{padding:"12px 16px"}}><div style={{display:"flex",alignItems:"center",gap:8}}><Ic name="pill" size={16}/>{p.medicationName}</div></td>
            <td style={{padding:"12px 16px",color:C.tm,fontSize:13}}>{p.quantity} {p.unit}</td>
            <td style={{padding:"12px 16px",color:C.tm,fontSize:13}}>{p.estimatedEndDate?new Date(p.estimatedEndDate).toLocaleDateString("pt-BR"):"—"}</td>
            <td style={{padding:"12px 16px"}}><Badge color={sc[p.status]}>{sl[p.status]||p.status}</Badge></td>
            <td style={{padding:"12px 16px",color:C.tm,fontSize:13}}>{rs.filter(r=>r.status==="SENT").length}/{rs.length}</td>
          </tr>})}
        </tbody>
      </table>
    </Card>
    <PurchModal open={mo} onClose={()=>setMo(false)} onOk={()=>{load();setMo(false);setToast("Compra registrada")}}/>
    {toast&&<Toast msg={toast} onClose={()=>setToast(null)}/>}
  </div>;
}
function PurchModal({open,onClose,onOk}){
  const{token}=useA();
  const[cs,setCs]=useState([]);
  const[f,setF]=useState({cid:"",med:"",qty:"",unit:"comprimidos",dpd:"",td:"",ae:true,ad:"3",fe:true,sh:"10",sm:"0"});
  const[err,setErr]=useState("");
  const[ld,setLd]=useState(false);
  useEffect(()=>{if(open)api("/customers",{token}).then(setCs).catch(()=>{})},[open,token]);
  const s=k=>e=>setF(p=>({...p,[k]:e.target?.type==="checkbox"?e.target.checked:e.target.value}));
  const go=async()=>{
    if(!f.cid||!f.med||!f.qty){setErr("Preencha cliente, medicamento e quantidade");return}
    setErr("");setLd(true);
    try{
      await api("/purchases",{method:"POST",body:{
        customerId:f.cid,medicationName:f.med,quantity:parseFloat(f.qty),unit:f.unit,
        dosePerDay:f.dpd?parseFloat(f.dpd):undefined,treatmentDays:f.td?parseInt(f.td):undefined,
        advanceEnabled:f.ae,advanceDays:parseInt(f.ad)||3,finalDayEnabled:f.fe,
        sendHour:parseInt(f.sh)||10,sendMinute:parseInt(f.sm)||0
      },token});
      setF({cid:"",med:"",qty:"",unit:"comprimidos",dpd:"",td:"",ae:true,ad:"3",fe:true,sh:"10",sm:"0"});onOk();
    }catch(e){setErr(e.message)}finally{setLd(false)}
  };
  return <Modal open={open} onClose={onClose} title="Nova compra" width={580}>
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div><label style={{display:"block",fontSize:13,color:C.tm,marginBottom:6}}>Cliente</label>
        <select style={{...inp,appearance:"none"}} value={f.cid} onChange={s("cid")}>
          <option value="">Selecione...</option>
          {cs.map(c=><option key={c.id} value={c.id}>{c.name||c.phone}</option>)}
        </select></div>
      <div><label style={{display:"block",fontSize:13,color:C.tm,marginBottom:6}}>Medicamento</label>
        <input style={inp} value={f.med} onChange={s("med")} placeholder="Losartana 50mg"/></div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <div><label style={{display:"block",fontSize:13,color:C.tm,marginBottom:6}}>Quantidade</label>
          <input style={inp} type="number" value={f.qty} onChange={s("qty")} placeholder="30"/></div>
        <div><label style={{display:"block",fontSize:13,color:C.tm,marginBottom:6}}>Unidade</label>
          <input style={inp} value={f.unit} onChange={s("unit")} placeholder="comprimidos"/></div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <div><label style={{display:"block",fontSize:13,color:C.tm,marginBottom:6}}>Dose/dia (opcional)</label>
          <input style={inp} type="number" value={f.dpd} onChange={s("dpd")} placeholder="1"/></div>
        <div><label style={{display:"block",fontSize:13,color:C.tm,marginBottom:6}}>Dias tratamento (opcional)</label>
          <input style={inp} type="number" value={f.td} onChange={s("td")} placeholder="30"/></div>
      </div>
      <div style={{borderTop:"1px solid "+C.bd,paddingTop:14,marginTop:4}}>
        <div style={{fontSize:14,fontWeight:600,marginBottom:12}}>Lembretes</div>
        <label style={{display:"flex",alignItems:"center",gap:8,fontSize:14,cursor:"pointer",marginBottom:8}}>
          <input type="checkbox" checked={f.ae} onChange={s("ae")}/>Aviso antecipado
          {f.ae&&<span style={{display:"flex",alignItems:"center",gap:4}}>
            <input style={{...inp,width:60,padding:"4px 8px",textAlign:"center"}} type="number" value={f.ad} onChange={s("ad")}/>dias antes</span>}
        </label>
        <label style={{display:"flex",alignItems:"center",gap:8,fontSize:14,cursor:"pointer",marginBottom:10}}>
          <input type="checkbox" checked={f.fe} onChange={s("fe")}/>Aviso no último dia
        </label>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:13,color:C.tm}}>Horário (UTC):</span>
          <input style={{...inp,width:60,padding:"4px 8px",textAlign:"center"}} type="number" min="0" max="23" value={f.sh} onChange={s("sh")}/>
          <span style={{color:C.tm}}>:</span>
          <input style={{...inp,width:60,padding:"4px 8px",textAlign:"center"}} type="number" min="0" max="59" value={f.sm} onChange={s("sm")}/>
        </div>
      </div>
      {err&&<div style={{color:C.dn,fontSize:13}}>{err}</div>}
      <button onClick={go} disabled={ld} style={{...btn,justifyContent:"center",background:C.pr,color:"#fff",marginTop:4}}>{ld?"Salvando...":"Registrar compra"}</button>
    </div>
  </Modal>;
}

function Templates(){
  const{token}=useA();
  const[ts,setTs]=useState([]);
  useEffect(()=>{api("/templates",{token}).then(setTs).catch(()=>{})},[token]);
  const tl={ADVANCE:"Antecipado",FINAL_DAY:"Último dia"};
  return <div>
    <h1 style={{fontSize:24,marginBottom:20}}>Templates</h1>
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      {ts.length===0?<Card><p style={{color:C.tm,textAlign:"center"}}>Nenhum template</p></Card>
      :ts.map(t=><Card key={t.id}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"start",flexWrap:"wrap",gap:8}}>
          <div><div style={{fontSize:16,fontWeight:600,marginBottom:4}}>{t.name}</div>
            <div style={{display:"flex",gap:8,marginBottom:10}}>
              <Badge>{t.key}</Badge>
              {t.type&&<Badge color={C.wn}>{tl[t.type]||t.type}</Badge>}
              {t.isDefault&&<Badge color={C.ok}>Padrão</Badge>}
            </div></div>
          <Badge color={t.active?C.ok:C.dn}>{t.active?"Ativo":"Inativo"}</Badge>
        </div>
        <div style={{background:C.sa,borderRadius:8,padding:14,fontSize:13,lineHeight:1.6,color:C.tm,whiteSpace:"pre-wrap",border:"1px solid "+C.bd}}>{t.body}</div>
      </Card>)}
    </div>
  </div>;
}

const nav=[{k:"dash",l:"Painel",i:"home"},{k:"cust",l:"Clientes",i:"users"},{k:"purch",l:"Compras",i:"cart"},{k:"tpl",l:"Templates",i:"tpl"}];

function Side({active,onChange}){
  const{user,logout}=useA();
  const[col,setCol]=useState(window.innerWidth<768);
  return <div style={{width:col?64:220,minHeight:"100vh",background:C.sf,borderRight:"1px solid "+C.bd,display:"flex",flexDirection:"column",transition:"width .2s",flexShrink:0}}>
    <div style={{padding:col?"20px 12px":"20px 18px",borderBottom:"1px solid "+C.bd,display:"flex",alignItems:"center",gap:10,cursor:"pointer"}} onClick={()=>setCol(!col)}>
      <span style={{fontSize:22}}>💊</span>{!col&&<span style={{fontSize:16,fontWeight:700}}>Recompra</span>}
    </div>
    <nav style={{flex:1,padding:"12px 8px"}}>
      {nav.map(n=>{const a=active===n.k;return <button key={n.k} onClick={()=>onChange(n.k)} style={{
        display:"flex",alignItems:"center",gap:10,width:"100%",padding:col?"10px 12px":"10px 14px",
        borderRadius:8,border:"none",cursor:"pointer",background:a?C.pr+"20":"transparent",
        color:a?C.pr:C.tm,fontSize:14,fontWeight:a?600:400,marginBottom:4,textAlign:"left",transition:"background .15s"
      }}><Ic name={n.i} size={20}/>{!col&&n.l}</button>})}
    </nav>
    <div style={{padding:col?"16px 8px":"16px 14px",borderTop:"1px solid "+C.bd}}>
      {!col&&user&&<div style={{fontSize:13,color:C.tm,marginBottom:10,overflow:"hidden",textOverflow:"ellipsis"}}>{user.name||user.email}</div>}
      <button onClick={logout} style={{display:"flex",alignItems:"center",gap:8,width:"100%",padding:"8px 10px",borderRadius:8,border:"none",cursor:"pointer",background:"transparent",color:C.dn,fontSize:13,textAlign:"left"}}>
        <Ic name="out" size={18}/>{!col&&"Sair"}
      </button>
    </div>
  </div>;
}

function Shell(){
  const[pg,setPg]=useState("dash");
  const pages={dash:<Dashboard/>,cust:<Customers/>,purch:<Purchases/>,tpl:<Templates/>};
  return <div style={{display:"flex",minHeight:"100vh",background:C.bg}}>
    <Side active={pg} onChange={setPg}/>
    <main style={{flex:1,padding:"28px 32px",overflowX:"hidden",maxWidth:"100%"}}>{pages[pg]||pages.dash}</main>
  </div>;
}

function App(){
  const{token,loading}=useA();
  if(!token)return <Login/>;
  return <Shell/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Auth><App/></Auth>);
</script>
</body>
</html>
